<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To-Do List</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            text-align: center;
            padding: 20px;
            color: white;
        }

        .todo-container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
            color: #667eea;
        }

        .todo-container:hover {
            transform: scale(1.02);
        }

        input {
            width: 75%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5563c1;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f9f9f9;
            padding: 10px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            cursor: grab;
        }

        .inline-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        li:hover {
            transform: scale(1.02);
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .date {
            font-size: 12px;
            color: #667eea;
        }
    </style>
</head>

<body>
    <div class="todo-container">
        <h2>📌 To-Do List</h2>
        <div class="inline-container">
            <label for="name"> Task Name</label>
            <input type="text" id="taskInput" placeholder="Add a new task...">
        </div>
        <div class="inline-container">
            <label for="name">Due Date</label>
            <input type="date" id="taskDate">
        </div>
        <button onclick="addTask()">+ Add Task</button>
        <ul id="taskList"></ul>
    </div>
</body>

</html>
